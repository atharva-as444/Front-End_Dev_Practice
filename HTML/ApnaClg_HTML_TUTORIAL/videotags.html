<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Tag</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
    
  .home-link {
    display: block;
    text-align: left;   /* alignment fix */
    font-size: 16px;
    /*color: yellow;
    background-color:  #167c82; */ 
    background: #2575fc; 
           color: #f5f5f5; 
    padding: 2px 20px;
    text-decoration: none;
    border-top-left-radius: 5px;
    border-bottom-right-radius: 5px;
    border: 2px solid #000000;
    width: 10%;
    margin: left;       /* left align */
  }
  .home-link:hover {
    background-color: #2575fc; /* hover color */ 
    color: white;
    transition: 0.3s ease;
    transform: scale(1.07);
  }
  </style>
</head>
<body style="background-color: #121212; color: #f5f5f5;">

  <header> <h2 style="text-align: center; 
           background: linear-gradient(to right, #6a11cb, #2575fc); 
           color: #f5f5f5; 
           padding: 15px; 
           border-radius: 2px; 
           margin: 0 auto;
           font-family: 'Orbitron', sans-serif;
           letter-spacing: 2px;">
  VIDEO TAG IN HTML
</h2>
  <br> <br> <hr width="60%" style="border-color: #b388ff;">

  </header>
<main>
    <h3 style="color: #b388ff; text-align: center;">This is a video tag added in HTML for absolute path</h3>
    <br> 

    <iframe style="display: block; margin: 0 auto;" width="560" height="315" src="https://www.youtube.com/embed/HcOc7P5BMi4?si=eWseSBo1u4eghd12" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <br> <br> <hr width="95%"style="margin: 0 auto; border-color: #b388ff;">

    <h3 style="color: #b388ff; text-align: center;">This is a video tag added in HTML for relative path</h3>
    <br> 

    <video style="display: block; margin: 0 auto;" width="560" height="315" src="vids/SAMPLE_VID_STOCK_HTML.mp4" controls>
    </video>
</main>
<footer>
     <br>
     
     <a class="home-link" href="index.html">Return to Home</a> 
</footer>
</body>
</html>
