<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>


    <style>
        .link-btn {
            display: block;
            margin: 0 auto;
            padding: 5px 15px;
            background-color: rgb(243, 132, 251);
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            border: 2px solid black;
            letter-spacing: 1px;
        }

        .link-btn:hover {
        background-color:#167c82;/* hover background color change */
        color:white;           /* sirf text color change */
        text-decoration: none;/* hover pe underline */
        transition: 0.3s ease;     /* smooth transition */;
        }
           
        
        .link-btn-home {
            display: block;
            text-align: left;   /* alignment fix */
            font-size: 16px;
            color: white;
            background-color: slategray; /* default color */
            padding: 2px 20px;
            text-decoration: none;
            border-top-left-radius: 5px;
            border-bottom-right-radius: 5px;
            border: 2px solid #000000;
            width: 9%;
            margin: left;       /* left align */
           }

           .link-btn-home:hover {
            background-color: #167c82; /* hover pe background color change */
            color: white;           /* sirf text color change */
            text-decoration: none;  /* hover pe underline */
            transition: 0.3s ease; /* smooth transition */
            transform: scale(1.07); /* hover pe rotate effect */
            transition: transform 0.3s ease; /* smooth transition for transform */
           }
    </style>
    
</head> 
<body style="background: linear-gradient(to right, #ffecd2, #fcb69f);">
     
<header>
    <h1 style="background-color: darkslategray;color: white;text-align: center; display: block;width: 100%;">Contact Me</h1>
    <br> <hr width="60%" color="black"> <br>
</header>

    <main>
    <h3 style="text-align: center; color: olive">Get in Touch</h3> 
<form action="submit.html" method="get" >
    <input type="text" placeholder="Your Name" style="display: block; margin: 0 auto; padding: 10px; width: 50%;"><br>

    <input type="email" placeholder="Your Email" style="display: block; margin: 0 auto; padding: 10px; width: 50%;"><br>
     
    <input type="text" placeholder="Your Phone Number" style="display: block; margin: 0 auto; padding: 10px; width: 50%;"><br>

    <textarea placeholder="Your Message" style="display: block; margin: 0 auto; padding: 10px; width: 50%; height: 100px; background-color: #f0f0f0; border: 1px solid #ccc;"></textarea><br> 

    <h3 style="text-align: center; color: olive;">We will get back to you as soon as possible!</h3> 

    <button class="link-btn">Submit</button>
</form>
  <br>    <hr width="60%" color="black"><br>
</main>
<footer>
    <a class="link-btn-home" href="index.html">Return to Home</a>
</footer>
</body>
</html>
