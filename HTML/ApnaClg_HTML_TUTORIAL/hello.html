<!DOCTYPE html>

    <style>
        body {

            font-family: Arial, sans-serif;
            padding: 0;
            text-align: center;

        }

        }


        h1{
            background: linear-gradient(to right, blue,slateblue, purple); 
            color:#fff;
            padding: 6px;
              display: block;        /* block banaya */

        }


       .home-link{
          display: block;        /* block banaya */

          background:gray;
          color: white;
          padding: 10px 20px;
          border-radius: 5px;
          text-decoration: none;
          border: 2px solid black;
        }


        .home-link:hover{
             background: #16cd;
            border: solid 2px #000000;
        
           
        }
